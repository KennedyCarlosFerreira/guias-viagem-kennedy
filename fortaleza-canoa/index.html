<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f5c">
<title>Guia de viagem</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--mar:#0b4f5c;--areia:#f7f4ee;--tinta:#1b2a2e;--suave:#5d6f73;--linha:#e3ddd2;--urucum:#d9572b}
@media(prefers-color-scheme:dark){:root{--mar:#7fc9d4;--areia:#0f1719;--tinta:#e8eeee;--suave:#9db0b3;--linha:#26363a;--urucum:#f08a5d}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--areia);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
main{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.5rem;line-height:1.2}
p{margin:0;color:var(--suave)}
form{display:flex;flex-direction:column;gap:12px}
input[type=password],input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--linha);background:transparent;color:var(--tinta);font:inherit}
button{padding:14px;border-radius:12px;border:0;background:var(--mar);color:var(--areia);font:700 1rem system-ui;cursor:pointer}
label{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--suave)}
#erro{color:var(--urucum);font-weight:600;min-height:1.4em}
input:focus-visible,button:focus-visible{outline:3px solid var(--urucum);outline-offset:2px}
</style></head>
<body>
<main id="entrada">
  <h1>Guia da sua viagem</h1>
  <p>Digite a senha que o Kennedy enviou. Depois de abrir uma vez, o guia funciona sem internet.</p>
  <form id="f" autocomplete="off">
    <input id="senha" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Senha" aria-label="Senha" required>
    <label><input type="checkbox" id="lembrar" checked> Lembrar neste celular</label>
    <button type="submit">Abrir guia</button>
    <div id="erro" role="alert"></div>
  </form>
</main>

var CHAVE="guia-senha-v1";
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function abrir(senha){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey("raw",enc.encode(senha),"PBKDF2",false,["deriveKey"]);
  var chave=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(PAYLOAD.s),iterations:PAYLOAD.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var claro=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.i)},chave,b64(PAYLOAD.c));
  return new TextDecoder().decode(claro);
}
function mostrar(html){document.open();document.write(html);document.close()}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
(async function(){
  if(!window.crypto||!crypto.subtle){document.getElementById("erro").textContent="Este navegador não abre o guia. Use o Chrome.";return}
  var salva=null;try{salva=localStorage.getItem(CHAVE)}catch(e){}
  if(salva){try{mostrar(await abrir(salva));return}catch(e){try{localStorage.removeItem(CHAVE)}catch(_){}}}
  document.getElementById("f").addEventListener("submit",async function(ev){
    ev.preventDefault();var s=document.getElementById("senha").value.trim(),er=document.getElementById("erro");er.textContent="Abrindo…";
    try{var h=await abrir(s);if(document.getElementById("lembrar").checked){try{localStorage.setItem(CHAVE,s)}catch(e){}}mostrar(h)}
    catch(e){er.textContent="Senha incorreta. Confira com o Kennedy."}
  });
})();
