<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f5c"><meta name="robots" content="noindex,nofollow">
<title>Painel da Agência</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<style>
html,body{height:100%;margin:0}body{background:#0b4f5c;color:#f7f4ee;font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
img{width:96px;height:96px;border-radius:22px;margin-bottom:16px}h1{font-size:1.4rem;margin:0 0 8px}p{margin:0 0 20px;opacity:.85}
a{display:inline-block;padding:14px 24px;border-radius:12px;background:#f7f4ee;color:#0b4f5c;font-weight:700;text-decoration:none}
</style></head><body>
<main><img src="icon-192.png" alt=""><h1>Painel da Agência</h1><p id="m">Abrindo o painel…</p><a id="b" href="#">Abrir painel</a></main>
<script>
var URL_PAINEL="https://script.google.com/macros/s/AKfycbzc5XFzikwwemTPJHRy8fPDTLyIfnGsDxXwSYk379IbVD77fnrC580lRta5-uxBrnwa/exec";
document.getElementById("b").href=URL_PAINEL;
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
var app=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
var m=document.getElementById("m");
if(!navigator.onLine){m.textContent="Sem internet. O painel precisa de conexão para mostrar os dados."}
else if(app){m.textContent="Abrindo o painel…";setTimeout(function(){location.replace(URL_PAINEL)},300)}
else{m.textContent="Para ter o ícone: menu do navegador > Instalar app (Android) ou Compartilhar > Adicionar à Tela de Início (iPhone). Depois, abra pelo ícone."}
</script></body></html>
